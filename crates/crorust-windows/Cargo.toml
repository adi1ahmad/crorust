[package]
name = "crorust-windows"
description = "Pure-Rust library for creating Windows MSIX packages, MRM PRI resource tables, and portable directories for CroRust."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/crorust-windows"
license.workspace = true
readme = "README.md"
keywords = ["windows", "msix", "opc", "pri", "pkcs7"]
categories = ["development-tools::build-utils", "os::windows-apis"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid-header.html"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
byteorder.workspace = true
crorust-common.workspace = true
hex.workspace = true
quick-xml.workspace = true
rasn.workspace = true
rasn-cms.workspace = true
rasn-pkix.workspace = true
rayon.workspace = true
image = { workspace = true, features = ["png"] }
rsa.workspace = true
serde.workspace = true
sha2.workspace = true
zip.workspace = true

[dev-dependencies]
image = { workspace = true, features = ["png"] }
rsa.workspace = true
tempfile.workspace = true
