[package]
name = "crorust-linux"
description = "Pure-Rust library for assembling Linux AppDirs and SquashFS Type-2 AppImages for CroRust."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/crorust-linux"
license.workspace = true
readme = "README.md"
keywords = ["linux", "appimage", "squashfs", "backhand", "packaging"]
categories = ["development-tools::build-utils", "os::linux-apis"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid-header.html"]

[dependencies]
anyhow.workspace = true
backhand.workspace = true
crorust-common.workspace = true
hex.workspace = true
serde.workspace = true
sha2.workspace = true
tracing.workspace = true
walkdir.workspace = true
which.workspace = true

[dev-dependencies]
tempfile.workspace = true
