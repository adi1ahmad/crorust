[package]
name = "crorust-android"
description = "Pure-Rust library for creating, compiling resources, and signing Android APK and AAB packages for CroRust."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/crorust-android"
license.workspace = true
readme = "README.md"
keywords = ["android", "apk", "axml", "arsc", "signing"]
categories = ["development-tools::build-utils", "encoding"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid-header.html"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
byteorder.workspace = true
crorust-common.workspace = true
hex.workspace = true
quick-xml.workspace = true
rasn.workspace = true
rasn-cms.workspace = true
rasn-pkix.workspace = true
rayon.workspace = true
rsa.workspace = true
serde.workspace = true
sha2.workspace = true
tracing.workspace = true
zip.workspace = true

[dev-dependencies]
image = { workspace = true, features = ["png"] }
tempfile.workspace = true
tracing-log.workspace = true
tracing-subscriber.workspace = true
