[package]
name = "crorust-common"
description = "Core shared primitives for CroRust: page-aligned ZIP streaming, fast streaming SHA-256 digests, and parallel raster resizers."
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/crorust-common"
license.workspace = true
readme = "README.md"
keywords = ["zip", "hash", "image", "resizer", "streaming"]
categories = ["development-tools::build-utils"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid-header.html"]

[dependencies]
anyhow.workspace = true
byteorder.workspace = true
dunce.workspace = true
hex.workspace = true
image.workspace = true
pem.workspace = true
rasn.workspace = true
rasn-pkix.workspace = true
rayon.workspace = true
rsa.workspace = true
sha2.workspace = true
tracing.workspace = true
walkdir.workspace = true
zip = { workspace = true, features = ["deflate"] }

[dev-dependencies]
tempfile.workspace = true
