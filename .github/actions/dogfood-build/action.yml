name: "Dogfood build (one host -> target leg)"
description: >-
  Builds, verifies, stages and caches one crorust dogfood leg. Shared by the three
  tier4-dogfood-* jobs so the 18-leg matrix has a single implementation.

inputs:
  platform:
    description: "Target platform (linux, macos, ios, android, windows, web)"
    required: true
  arch:
    description: "Target architecture (x64, arm64, ...)"
    required: true
  cli_artifact:
    description: "Name of the Tier 2 CLI artifact to download"
    required: true
  host_slug:
    description: "Host slug used in the uploaded artifact name (e.g. linux-x64)"
    required: true
  nightly:
    description: "Pinned Rust nightly (must match templates/crorust.ruxt/rust-toolchain.toml)"
    required: true
  cache_dir:
    description: "Absolute crorust toolchain cache directory"
    required: true
  tool_cache_key:
    description: "Primary cache key for the toolchain cache"
    required: true

runs:
  using: composite
  steps:
    - name: Download crorust CLI artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.cli_artifact }}
        path: bin

    - name: Ensure CLI executable permission (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: chmod +x bin/crorust

    - name: Install pinned Rust nightly (template toolchain)
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ inputs.nightly }}
        targets: wasm32-unknown-unknown,aarch64-linux-android,x86_64-linux-android,armv7-linux-androideabi,aarch64-apple-ios,x86_64-apple-darwin,aarch64-apple-darwin,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-pc-windows-gnu,x86_64-pc-windows-msvc
        components: rust-src,rust-analyzer,clippy,rustfmt

    - name: Optimize Windows File I/O (Disable Defender Scanning)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $exclusions = @(
          "$env:GITHUB_WORKSPACE",
          "$env:RUNNER_TEMP",
          "$env:TEMP",
          "$env:USERPROFILE\.cargo",
          "$env:USERPROFILE\.rustup"
        )
        Get-PSDrive -PSProvider FileSystem | ForEach-Object { $exclusions += $_.Root }
        $exclusions = $exclusions | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique

        $regPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender\Exclusions\Paths"
        if (-not (Test-Path $regPath)) {
          New-Item -Path $regPath -Force | Out-Null
        }
        foreach ($path in $exclusions) {
          Add-MpPreference -ExclusionPath $path -ErrorAction SilentlyContinue
          New-ItemProperty -Path $regPath -Name $path -Value 0 -PropertyType DWORD -Force -ErrorAction SilentlyContinue | Out-Null
        }
        Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue

        Write-Host "Active Windows Defender exclusions:"
        (Get-MpPreference).ExclusionPath

    - name: Install Host Dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          clang \
          lld \
          llvm \
          cpio \
          libarchive-tools \
          libasound2-dev \
          libudev-dev \
          squashfs-tools \
          libwayland-dev \
          libx11-dev \
          libxkbcommon-dev \
          libxkbcommon-x11-0 \
          xvfb \
          unzip \
          libgl1-mesa-dri \
          mesa-vulkan-drivers \
          libgl1 \
          libegl1

    - name: Install Upstream LLVM (macOS host for Linux/Windows cross-builds)
      if: runner.os == 'macOS' && (inputs.platform == 'linux' || inputs.platform == 'windows')
      shell: bash
      run: |
        add_to_path() {
          local dir="$1"
          if [ -n "$dir" ] && [ -d "$dir" ]; then
            echo "$dir" >> "$GITHUB_PATH"
            export PATH="$dir:$PATH"
          fi
        }

        LLVM_PREFIX=""
        for ver in llvm@18 llvm@17 llvm@16 llvm@15; do
          CANDIDATE="$(brew --prefix "$ver" 2>/dev/null || true)"
          if [ -n "$CANDIDATE" ] && [ -x "$CANDIDATE/bin/clang" ] && [ -x "$CANDIDATE/bin/ld.lld" ] && [ -x "$CANDIDATE/bin/lld-link" ]; then
            echo "Found pre-installed LLVM at $CANDIDATE ($ver)"
            LLVM_PREFIX="$CANDIDATE"
            break
          fi
        done

        if [ -n "$LLVM_PREFIX" ]; then
          add_to_path "$LLVM_PREFIX/bin"
        else
          echo "No pre-installed LLVM suite found; installing llvm and lld via Homebrew..."
          HOMEBREW_NO_AUTO_UPDATE=1 brew install llvm lld
          add_to_path "$(brew --prefix llvm)/bin"
          LLD_PREFIX="$(brew --prefix lld 2>/dev/null || true)"
          if [ -n "$LLD_PREFIX" ]; then
            add_to_path "$LLD_PREFIX/bin"
          fi
        fi

        echo "Active tool paths:"
        which clang
        which ld.lld
        which lld-link

        clang --version
        ld.lld --version
        lld-link --version

    - name: Install Host Dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (Test-Path "C:\Program Files\LLVM\bin") {
          Add-Content $env:GITHUB_PATH "C:\Program Files\LLVM\bin"
        }

    - name: Restore crorust toolchain cache
      id: crorust-tools
      uses: actions/cache/restore@v4
      with:
        path: ${{ inputs.cache_dir }}
        key: ${{ inputs.tool_cache_key }}
        restore-keys: |
          crorust-tools-v2-${{ runner.os }}-${{ inputs.platform }}-
          crorust-tools-v2-${{ runner.os }}-

    - name: Configure Cargo Cache for Template
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "templates/crorust.ruxt -> .cache/target"
        shared-key: "template-v2-${{ runner.os }}-${{ inputs.platform }}-${{ inputs.arch }}"
        cache-on-failure: false
        save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

    - name: Install Trunk & wasm tools for Web builds (Linux, cached)
      if: runner.os == 'Linux' && inputs.platform == 'web'
      shell: bash
      run: |
        mkdir -p "$HOME/.cargo/bin"

        # 1. Install Trunk v0.21.8 if not already present
        if ! command -v trunk >/dev/null 2>&1; then
          if command -v gh >/dev/null 2>&1; then
            gh release download v0.21.8 --repo trunk-rs/trunk --pattern "trunk-x86_64-unknown-linux-gnu.tar.gz" --output /tmp/trunk.tar.gz --clobber
          else
            url="https://github.com/trunk-rs/trunk/releases/download/v0.21.8/trunk-x86_64-unknown-linux-gnu.tar.gz"
            curl -sSfL --retry 5 --retry-delay 2 --retry-connrefused "$url" -o /tmp/trunk.tar.gz
          fi
          echo "cd9fb2822c9f0ae111737500c179226cb080241ac55002c1db7344aa51a97fec  /tmp/trunk.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trunk.tar.gz -C "$HOME/.cargo/bin"
          rm -f /tmp/trunk.tar.gz
        fi
        trunk --version

        # 2. Install wasm-bindgen 0.2.129 to prevent on-the-fly CDN timeout crashes
        if ! command -v wasm-bindgen >/dev/null 2>&1 || [[ "$(wasm-bindgen --version 2>&1)" != *"0.2.129"* ]]; then
          if command -v gh >/dev/null 2>&1; then
            gh release download 0.2.129 --repo wasm-bindgen/wasm-bindgen --pattern "wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz" --output /tmp/wasm-bindgen.tar.gz --clobber
          else
            wb_url="https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz"
            curl -sSfL --retry 5 --retry-delay 2 --retry-connrefused "$wb_url" -o /tmp/wasm-bindgen.tar.gz
          fi
          echo "82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e  /tmp/wasm-bindgen.tar.gz" | sha256sum -c -
          tar -xzf /tmp/wasm-bindgen.tar.gz --strip-components=1 -C "$HOME/.cargo/bin"
          rm -f /tmp/wasm-bindgen.tar.gz
        fi
        wasm-bindgen --version

        # 3. Resilient wasm-opt installation with graceful fallback
        if ! command -v wasm-opt >/dev/null 2>&1 || ! wasm-opt --version >/dev/null 2>&1; then
          echo "Installing wasm-opt version_116 (Linux x86_64)..."
          install_wasm_opt() {
            set -e
            if command -v gh >/dev/null 2>&1; then
              gh release download version_116 --repo WebAssembly/binaryen --pattern "binaryen-version_116-x86_64-linux.tar.gz" --output /tmp/binaryen.tar.gz --clobber
            else
              opt_url="https://github.com/WebAssembly/binaryen/releases/download/version_116/binaryen-version_116-x86_64-linux.tar.gz"
              curl -sSfL --retry 5 --retry-delay 2 --retry-connrefused "$opt_url" -o /tmp/binaryen.tar.gz
            fi
            echo "c55b74f3109cdae97490faf089b0286d3bba926bb6ea5ed00c8c784fc53718fd  /tmp/binaryen.tar.gz" | sha256sum -c -
            tar -xzf /tmp/binaryen.tar.gz --strip-components=2 -C "$HOME/.cargo/bin" "binaryen-version_116/bin/wasm-opt"
            rm -f /tmp/binaryen.tar.gz
            wasm-opt --version
          }

          if install_wasm_opt; then
            echo "wasm-opt installed and verified successfully."
          else
            echo "::warning::wasm-opt pre-installation failed. Purging incomplete files to allow Trunk fallback."
            rm -f "$HOME/.cargo/bin/wasm-opt" /tmp/binaryen.tar.gz
          fi
        fi

    - name: Install Trunk & wasm tools for Web builds (macOS, cached)
      if: runner.os == 'macOS' && inputs.platform == 'web'
      shell: bash
      run: |
        mkdir -p "$HOME/.cargo/bin"

        # 1. Install Trunk v0.21.8 if not already present
        if ! command -v trunk >/dev/null 2>&1; then
          if command -v gh >/dev/null 2>&1; then
            gh release download v0.21.8 --repo trunk-rs/trunk --pattern "trunk-aarch64-apple-darwin.tar.gz" --output /tmp/trunk.tar.gz --clobber
          else
            url="https://github.com/trunk-rs/trunk/releases/download/v0.21.8/trunk-aarch64-apple-darwin.tar.gz"
            curl -sSfL --retry 5 --retry-delay 2 --retry-connrefused "$url" -o /tmp/trunk.tar.gz
          fi
          echo "934e2fba770cfc20b4e3498e35fbe8a03b0e6e60580cdc36eb070002834bc208  /tmp/trunk.tar.gz" | shasum -a 256 -c -
          tar -xzf /tmp/trunk.tar.gz -C "$HOME/.cargo/bin"
          rm -f /tmp/trunk.tar.gz
        fi
        trunk --version

        # 2. Install wasm-bindgen 0.2.129 to prevent on-the-fly CDN timeout crashes
        if ! command -v wasm-bindgen >/dev/null 2>&1 || [[ "$(wasm-bindgen --version 2>&1)" != *"0.2.129"* ]]; then
          if command -v gh >/dev/null 2>&1; then
            gh release download 0.2.129 --repo wasm-bindgen/wasm-bindgen --pattern "wasm-bindgen-0.2.129-aarch64-apple-darwin.tar.gz" --output /tmp/wasm-bindgen.tar.gz --clobber
          else
            wb_url="https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-aarch64-apple-darwin.tar.gz"
            curl -sSfL --retry 5 --retry-delay 2 --retry-connrefused "$wb_url" -o /tmp/wasm-bindgen.tar.gz
          fi
          echo "81d4a23d56b3c3eb8187658329116d50e0b228a93b343825fb71f70179051cd1  /tmp/wasm-bindgen.tar.gz" | shasum -a 256 -c -
          tar -xzf /tmp/wasm-bindgen.tar.gz --strip-components=1 -C "$HOME/.cargo/bin"
          rm -f /tmp/wasm-bindgen.tar.gz
        fi
        wasm-bindgen --version

        # 3. Resilient wasm-opt installation with graceful fallback
        if ! command -v wasm-opt >/dev/null 2>&1 || ! wasm-opt --version >/dev/null 2>&1; then
          echo "Installing wasm-opt version_116 (macOS arm64)..."
          install_wasm_opt() {
            set -e
            mkdir -p "$HOME/.cargo/lib"
            if command -v gh >/dev/null 2>&1; then
              gh release download version_116 --repo WebAssembly/binaryen --pattern "binaryen-version_116-arm64-macos.tar.gz" --output /tmp/binaryen.tar.gz --clobber
            else
              opt_url="https://github.com/WebAssembly/binaryen/releases/download/version_116/binaryen-version_116-arm64-macos.tar.gz"
              curl -sSfL --retry 5 --retry-delay 2 --retry-connrefused "$opt_url" -o /tmp/binaryen.tar.gz
            fi
            echo "d8c978aec366629eae6fefbcedaf5093b829e4c5ab0e2990973b6e337c544867  /tmp/binaryen.tar.gz" | shasum -a 256 -c -
            tar -xzf /tmp/binaryen.tar.gz --strip-components=1 -C "$HOME/.cargo" "binaryen-version_116/bin/wasm-opt" "binaryen-version_116/lib/libbinaryen.dylib"
            cp -f "$HOME/.cargo/lib/libbinaryen.dylib" "$HOME/.cargo/bin/" 2>/dev/null || true
            rm -f /tmp/binaryen.tar.gz
            wasm-opt --version
          }

          if install_wasm_opt; then
            echo "wasm-opt installed and verified successfully."
          else
            echo "::warning::wasm-opt pre-installation failed. Purging incomplete files to allow Trunk fallback."
            rm -f "$HOME/.cargo/bin/wasm-opt" "$HOME/.cargo/bin/libbinaryen.dylib" "$HOME/.cargo/lib/libbinaryen.dylib" /tmp/binaryen.tar.gz
          fi
        fi

    - name: Install Trunk & wasm tools for Web builds (Windows, cached)
      if: runner.os == 'Windows' && inputs.platform == 'web'
      shell: pwsh
      run: |
        $dest = Join-Path $env:USERPROFILE ".cargo\bin"
        New-Item -ItemType Directory -Force -Path $dest | Out-Null

        # 1. Install Trunk v0.21.8 if not already present
        if (-not (Get-Command trunk -ErrorAction SilentlyContinue)) {
          $zip = Join-Path $env:TEMP "trunk.zip"
          if (Get-Command gh -ErrorAction SilentlyContinue) {
            gh release download v0.21.8 --repo trunk-rs/trunk --pattern "trunk-x86_64-pc-windows-msvc.zip" --output $zip --clobber
          } else {
            $url = "https://github.com/trunk-rs/trunk/releases/download/v0.21.8/trunk-x86_64-pc-windows-msvc.zip"
            curl.exe -sSfL --retry 5 --retry-delay 2 --retry-connrefused "$url" -o "$zip"
          }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "deb0db2a660b8e9ea3064a3862822e099fd01be06424d3125dbf917382195131") {
            throw "trunk checksum mismatch: $hash"
          }
          Expand-Archive $zip -DestinationPath $dest -Force
          Remove-Item -Force $zip
        }
        trunk --version

        # 2. Install wasm-bindgen 0.2.129 if not already present
        $wbCmd = Get-Command wasm-bindgen -ErrorAction SilentlyContinue
        if (-not $wbCmd -or ((wasm-bindgen --version) -notmatch "0.2.129")) {
          $tarGz = Join-Path $env:TEMP "wasm-bindgen.tar.gz"
          if (Get-Command gh -ErrorAction SilentlyContinue) {
            gh release download 0.2.129 --repo wasm-bindgen/wasm-bindgen --pattern "wasm-bindgen-0.2.129-x86_64-pc-windows-msvc.tar.gz" --output $tarGz --clobber
          } else {
            $wbUrl = "https://github.com/rustwasm/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-pc-windows-msvc.tar.gz"
            curl.exe -sSfL --retry 5 --retry-delay 2 --retry-connrefused "$wbUrl" -o "$tarGz"
          }
          $wbHash = (Get-FileHash $tarGz -Algorithm SHA256).Hash.ToLower()
          if ($wbHash -ne "79e348c169d0c10c0b287647f1e753d0985353ca96800bc29be8f4261baf13e6") {
            throw "wasm-bindgen checksum mismatch: $wbHash"
          }
          C:\Windows\System32\tar.exe -xzf $tarGz --strip-components=1 -C $dest
          Remove-Item -Force $tarGz
        }
        wasm-bindgen --version

        # 3. Resilient wasm-opt installation with graceful fallback
        $optWorks = $false
        if (Get-Command wasm-opt -ErrorAction SilentlyContinue) {
          try {
            $v = & wasm-opt --version 2>&1
            if ($LASTEXITCODE -eq 0) { $optWorks = $true }
          } catch {}
        }

        if (-not $optWorks) {
          Write-Host "Installing wasm-opt version_116 (Windows x86_64)..."
          $optTar = Join-Path $env:TEMP "binaryen.tar.gz"
          try {
            if (Get-Command gh -ErrorAction SilentlyContinue) {
              gh release download version_116 --repo WebAssembly/binaryen --pattern "binaryen-version_116-x86_64-windows.tar.gz" --output $optTar --clobber
            } else {
              $optUrl = "https://github.com/WebAssembly/binaryen/releases/download/version_116/binaryen-version_116-x86_64-windows.tar.gz"
              curl.exe -sSfL --retry 5 --retry-delay 2 --retry-connrefused "$optUrl" -o "$optTar"
            }
            $optHash = (Get-FileHash $optTar -Algorithm SHA256).Hash.ToLower()
            if ($optHash -ne "06a18d71ef294150c61737899d9b3290dbc635dba4dc4f80f528e04d4eaef478") {
              throw "wasm-opt checksum mismatch: $optHash"
            }
            C:\Windows\System32\tar.exe -xzf $optTar --strip-components=2 -C $dest "binaryen-version_116/bin/wasm-opt.exe"
            Remove-Item -Force -ErrorAction SilentlyContinue $optTar
            
            & wasm-opt --version
            if ($LASTEXITCODE -ne 0) { throw "wasm-opt failed verification test" }
            Write-Host "wasm-opt installed and verified successfully."
          } catch {
            Write-Warning "wasm-opt pre-installation failed: $_. Purging incomplete files to allow Trunk fallback."
            Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $dest "wasm-opt.exe"), $optTar
          }
        }

    - name: Record toolchain state before build
      shell: bash
      env:
        CRORUST_CACHE_DIR: ${{ inputs.cache_dir }}
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then CRORUST="./bin/crorust.exe"; else CRORUST="./bin/crorust"; fi
        {
          echo "### Toolchain before build: ${{ runner.os }} -> ${{ inputs.platform }}"
          echo '```text'
          "$CRORUST" i --project templates/crorust.ruxt --cache-dir "${{ inputs.cache_dir }}" 2>&1 | head -n 80 || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Build templates/crorust.ruxt
      shell: bash
      env:
        CRORUST_CACHE_DIR: ${{ inputs.cache_dir }}
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then CRORUST="./bin/crorust.exe"; else CRORUST="./bin/crorust"; fi
        "$CRORUST" build \
          --project templates/crorust.ruxt \
          --platform ${{ inputs.platform }} \
          --arch ${{ inputs.arch }} \
          --cache-dir "${{ inputs.cache_dir }}" \
          --release \
          --verbose

    - name: Prune raw archives before caching
      if: success()
      shell: bash
      run: |
        rm -rf "${{ inputs.cache_dir }}/download/"* "${{ inputs.cache_dir }}/downloads/"* 2>/dev/null || true

    - name: Save crorust toolchain cache
      if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.crorust-tools.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ inputs.cache_dir }}
        key: ${{ steps.crorust-tools.outputs.cache-primary-key }}

    - name: Report cache sizes
      if: always()
      shell: bash
      run: |
        {
          echo "### Cache sizes: ${{ runner.os }} -> ${{ inputs.platform }}"
          du -sh "${{ inputs.cache_dir }}" 2>/dev/null || true
          du -sh templates/crorust.ruxt/.cache/target 2>/dev/null || true
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Verify required host tools
      shell: bash
      run: |
        case "${{ inputs.platform }}" in
          android) NEED=unzip ;;
          web)     NEED="" ;;
          *)       NEED=file ;;
        esac
        if [ -n "$NEED" ] && ! command -v "$NEED" >/dev/null 2>&1; then
          echo "::error::Required host tool '$NEED' is not available on ${{ runner.os }}."
          exit 1
        fi

    - name: Verify Generated Artifact (Linux AppDir & Binary Inspection)
      if: inputs.platform == 'linux'
      shell: bash
      env:
        LIBGL_ALWAYS_SOFTWARE: "1"
        MESA_LOADER_DRIVER_OVERRIDE: "llvmpipe"
      run: |
        APPDIR=$(find templates/crorust.ruxt -type d -name "*AppDir" 2>/dev/null | head -n 1)
        test -n "$APPDIR" && test -d "$APPDIR"
        test -f "$APPDIR/AppRun"
        chmod +x "$APPDIR/AppRun" || true
        file -L "$APPDIR/AppRun" | grep -E "ELF 64-bit"
        if [ "${{ runner.os }}" = "Linux" ]; then
          timeout 2s xvfb-run -a -s "-screen 0 1024x768x24 +extension GLX" "$APPDIR/AppRun" || [ $? -eq 124 ]
        fi
        echo "Linux AppDir verified successfully at $APPDIR." >> "$GITHUB_STEP_SUMMARY"

    - name: Verify Generated Artifact (macOS App Bundle & Plist)
      if: inputs.platform == 'macos'
      shell: bash
      run: |
        APP_BUNDLE=$(find templates/crorust.ruxt -type d -path "*/macos/*" -name "*.app" 2>/dev/null | head -n 1)
        test -n "$APP_BUNDLE" && test -d "$APP_BUNDLE"
        PLIST="$APP_BUNDLE/Contents/Info.plist"
        test -f "$PLIST"
        if [ "${{ runner.os }}" = "Windows" ]; then PYTHON=python; else PYTHON=python3; fi
        "$PYTHON" -c "import plistlib; p = plistlib.load(open('$PLIST', 'rb')); assert 'CFBundleIdentifier' in p"
        file "$APP_BUNDLE/Contents/MacOS/"* | grep -E "Mach-O 64-bit"
        echo "macOS App Bundle verified successfully at $APP_BUNDLE." >> "$GITHUB_STEP_SUMMARY"

    - name: Verify Generated Artifact (iOS App Bundle & Plist)
      if: inputs.platform == 'ios'
      shell: bash
      run: |
        IOS_APP=$(find templates/crorust.ruxt -type d -path "*/ios/*" -name "*.app" 2>/dev/null | head -n 1)
        test -n "$IOS_APP" && test -d "$IOS_APP"
        PLIST="$IOS_APP/Info.plist"
        test -f "$PLIST"
        if [ "${{ runner.os }}" = "Windows" ]; then PYTHON=python; else PYTHON=python3; fi
        "$PYTHON" -c "import plistlib; p = plistlib.load(open('$PLIST', 'rb')); assert 'CFBundleIdentifier' in p"
        file "$IOS_APP/"* | grep -E "Mach-O 64-bit"
        echo "iOS App Bundle verified successfully at $IOS_APP." >> "$GITHUB_STEP_SUMMARY"

    - name: Verify Generated Artifact (Android APK Deep Inspection)
      if: inputs.platform == 'android'
      shell: bash
      run: |
        APK_FILE=$(find templates/crorust.ruxt -type f -name "*.apk" 2>/dev/null | head -n 1)
        test -n "$APK_FILE" && test -f "$APK_FILE"
        SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE")
        echo "Android APK Size: $SIZE bytes ($APK_FILE)"
        test "$SIZE" -gt 500000
        unzip -tq "$APK_FILE"
        unzip -l "$APK_FILE" | grep -E "classes\.dex"
        unzip -l "$APK_FILE" | grep -E "AndroidManifest\.xml"
        unzip -l "$APK_FILE" | grep -E "resources\.arsc"
        echo "Android APK verified successfully at $APK_FILE." >> "$GITHUB_STEP_SUMMARY"

    - name: Verify Generated Artifact (Windows Executable / MSIX)
      if: inputs.platform == 'windows'
      shell: bash
      run: |
        WIN_EXE=$(find templates/crorust.ruxt -type f -path "*/windows/*" -name "*.exe" 2>/dev/null | head -n 1)
        test -n "$WIN_EXE" && test -f "$WIN_EXE"
        SIZE=$(stat -c%s "$WIN_EXE" 2>/dev/null || stat -f%z "$WIN_EXE")
        test "$SIZE" -gt 100000
        file "$WIN_EXE" | grep -E "(PE32\+|MS Windows)"
        echo "Windows binary verified successfully at $WIN_EXE ($SIZE bytes)." >> "$GITHUB_STEP_SUMMARY"

    - name: Verify Generated Artifact (Web Distribution)
      if: inputs.platform == 'web'
      shell: bash
      run: |
        DIST_DIR="templates/crorust.ruxt/.cache/web-static/dist"
        test -d "$DIST_DIR"
        test -f "$DIST_DIR/index.html"
        WASM_FILE=$(find "$DIST_DIR" -maxdepth 2 -type f -name "*.wasm" 2>/dev/null | head -n 1)
        test -n "$WASM_FILE" && test -f "$WASM_FILE"
        echo "Web distribution package & WASM binary verified successfully in $DIST_DIR." >> "$GITHUB_STEP_SUMMARY"

    - name: Stage Application Build Artifacts for Upload
      shell: bash
      run: |
        mkdir -p "${{ github.workspace }}/staged_artifacts"
        PLATFORM="${{ inputs.platform }}"
        ARCH="${{ inputs.arch }}"

        case "$PLATFORM" in
          android)
            find templates/crorust.ruxt -type f -name "*.apk" -exec cp {} "${{ github.workspace }}/staged_artifacts/ruxt-android-${ARCH}.apk" \;
            ;;
          web)
            WEB_DIST="templates/crorust.ruxt/.cache/web-static/dist"
            if [ -d "$WEB_DIST" ]; then
              cp -r "$WEB_DIST" "${{ github.workspace }}/staged_artifacts/ruxt-web-${ARCH}"
            fi
            ;;
          windows)
            find templates/crorust.ruxt -type f -path "*/windows/*" -name "*.exe" -exec cp {} "${{ github.workspace }}/staged_artifacts/ruxt-windows-${ARCH}.exe" \;
            find templates/crorust.ruxt -type f -path "*/windows/*" -name "*.msix" -exec cp {} "${{ github.workspace }}/staged_artifacts/ruxt-windows-${ARCH}.msix" \; 2>/dev/null || true
            ;;
          macos|ios)
            APP_BUNDLE=$(find templates/crorust.ruxt -type d -path "*/$PLATFORM/*" -name "*.app" 2>/dev/null | head -n 1)
            if [ -n "$APP_BUNDLE" ]; then
              cp -rL "$APP_BUNDLE" "${{ github.workspace }}/staged_artifacts/ruxt-${PLATFORM}-${ARCH}.app"
            fi
            ;;
          linux)
            APPDIR=$(find templates/crorust.ruxt -type d -name "*AppDir" 2>/dev/null | head -n 1)
            if [ -n "$APPDIR" ]; then
              cp -rL "$APPDIR" "${{ github.workspace }}/staged_artifacts/ruxt-linux-${ARCH}.AppDir"
            fi
            find templates/crorust.ruxt -type f -name "*.AppImage" -exec cp {} "${{ github.workspace }}/staged_artifacts/ruxt-linux-${ARCH}.AppImage" \; 2>/dev/null || true
            ;;
        esac

        echo "Staged files for upload:"
        ls -la "${{ github.workspace }}/staged_artifacts"

    - name: Upload Staged Application Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ruxt-${{ inputs.platform }}-${{ inputs.arch }}-via-${{ inputs.host_slug }}
        path: ${{ github.workspace }}/staged_artifacts
        retention-days: 7
        if-no-files-found: error
