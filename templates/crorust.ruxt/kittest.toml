# egui_kittest snapshot configuration.
#
# NOTE: the macOS section key is `[mac]`, NOT `[macos]` — the `Config` struct
# field is `mac` and `#[serde(deny_unknown_fields)]` rejects `[macos]` (the
# rendered docs that show `[macos]` are a doc bug).

output_path = "tests/snapshots"
threshold = 0.6
failed_pixel_count_threshold = 0

[windows]
threshold = 0.8
failed_pixel_count_threshold = 0

[mac]
threshold = 0.8
failed_pixel_count_threshold = 0

[linux]
threshold = 0.8
failed_pixel_count_threshold = 0
